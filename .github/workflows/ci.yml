name: ci
on:
  push:
    branches: [debug/hooks-flake]
permissions:
  contents: read
jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja tmux
      - run: cmake --preset debug && cmake --build --preset debug
      - name: Loop the hooks test
        run: |
          export NQ=$PWD/build/debug/nuq FAKE_TUI=$PWD/build/debug/tests/fake_tui FAKE_AGENT=$PWD/tests/fake_agent.sh ASAN_OPTIONS=detect_leaks=0
          fails=0
          for i in $(seq 1 12); do
            if out=$(bash tests/hooks.sh 2>&1); then echo "run $i ok"; else fails=$((fails+1)); echo "=== run $i FAILED"; echo "$out" | cut -c1-300; fi
          done
          echo "fails=$fails"
