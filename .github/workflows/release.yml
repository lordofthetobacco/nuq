name: release

# Tests main, publishes the nuq packages as a GitHub release and points the
# Homebrew tap at them.
#
#   push to main                     run ci; if it passes and anything that
#                                    ends up in the binary changed since the
#                                    last release, release
#   run by hand on main              the same; "force" releases even when
#                                    nothing changed
#   run by hand on another branch,   dry run: the packages are built and
#   or a pull request touching the   kept as workflow artifacts, nothing is
#   build or this file               tagged or published
#
# Homebrew: every run installs the formula for its packages with brew. A
# release then writes that formula to the tap, so `brew upgrade` gets the
# release without anyone editing the tap. The push uses a deploy key of the
# tap that has write access; its private half is the secret
# HOMEBREW_TAP_DEPLOY_KEY of this repository.
#
# Versions: the next release is the latest vX.Y.Z tag with Z raised by one.
# To start a new minor or major line, raise the version in CMakeLists.txt
# (`project(nuq VERSION ...)`): a version there that is ahead of every tag
# is released as it is.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Release even if nothing in the binary changed
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/**
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - src/**
      - third_party/**
      - skills/**

permissions:
  contents: read

env:
  TAP: lordofthetobacco/homebrew-tap

# One run at a time on main, so two releases never pick the same version.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The whole test suite. Pull requests get it from ci.yml itself.
  ci:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      publish: ${{ steps.next.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # All history and tags: the version comes from the tags.
          fetch-depth: 0
      - name: Next version
        id: next
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          semver='[0-9]+\.[0-9]+\.[0-9]+'
          base=$(grep -Eo "^project\(nuq VERSION $semver" CMakeLists.txt | grep -Eo "$semver" || true)
          [ -n "$base" ] || { echo "::error::CMakeLists.txt has no project(nuq VERSION x.y.z)"; exit 1; }
          latest=$(git tag --list 'v*' | grep -Ex "v$semver" | sed 's/^v//' | sort -V | tail -n 1 || true)

          # What a release is made of. Tests, workflows and notes are not.
          inputs="CMakeLists.txt CMakePresets.json cmake src third_party skills"
          publish=true
          why="first release"
          if [ -z "$latest" ]; then
              next=$base
          elif [ "$(printf '%s\n' "$base" "$latest" | sort -V | tail -n 1)" != "$latest" ]; then
              next=$base
              why="CMakeLists.txt is ahead of v$latest"
          else
              next="${latest%.*}.$((${latest##*.} + 1))"
              why="patch after v$latest"
              # shellcheck disable=SC2086
              if [ "$FORCE" != true ] && git diff --quiet "v$latest" HEAD -- $inputs; then
                  publish=false
                  why="nothing in the binary changed since v$latest"
              fi
          fi

          # Only main is released; everything else is a dry run.
          case "$EVENT" in
          pull_request)
              publish=false
              next="$next-pr$PR"
              why="dry run for pull request #$PR"
              ;;
          workflow_dispatch)
              if [ "$GITHUB_REF" != refs/heads/main ]; then
                  publish=false
                  next="$next-dev"
                  why="dry run: $GITHUB_REF_NAME is not main"
              fi
              ;;
          esac

          echo "version=$next" >>"$GITHUB_OUTPUT"
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "nuq $next, publish: $publish ($why)" | tee -a "$GITHUB_STEP_SUMMARY"

  package:
    needs: [ci, version]
    # ci must not have failed (it is skipped for pull requests). A push to
    # main that brought nothing to release builds no packages.
    if: >-
      !cancelled() && !failure() && needs.version.result == 'success' &&
      (needs.version.outputs.publish == 'true' || github.event_name != 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu on offer, so the binary asks for an old glibc.
          - os: ubuntu-22.04
            target: linux-x86_64
            preset: release
          - os: ubuntu-22.04-arm
            target: linux-aarch64
            preset: release
          # Apple silicon only: macos-latest is an arm64 runner.
          - os: macos-latest
            target: macos-arm64
            preset: release
            cmake_args: -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          - os: windows-latest
            target: windows-x86_64
            preset: windows-release
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NAME: nuq-${{ needs.version.outputs.version }}-${{ matrix.target }}
      BUILD: build/${{ matrix.preset }}
    steps:
      - uses: actions/checkout@v7
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libncurses-dev
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Developer environment (MSVC, CMake, Ninja)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      # The default shell is bash on Linux and macOS and PowerShell on
      # Windows; these three lines mean the same in both. (Unquoted,
      # PowerShell would split -DNUQ_VERSION=0.1.0 at the first dot.)
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} "-DNUQ_VERSION=${{ needs.version.outputs.version }}" ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # ci runs the whole suite on debug builds; this checks the release build.
      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -R '^core$'

      - name: Package (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          [ "$("$BUILD/nuq" version)" = "nuq $VERSION" ] || { echo "::error::nuq does not report $VERSION"; exit 1; }
          if [ "$RUNNER_OS" = macOS ]; then
              [ "$(lipo -archs "$BUILD/nuq")" = arm64 ] || { echo "::error::nuq is not an arm64 binary"; exit 1; }
          fi
          cmake --install "$BUILD" --prefix "stage/$NAME" --strip
          mkdir "stage/$NAME/LICENSES"
          cp third_party/cjson/LICENSE "stage/$NAME/LICENSES/cJSON.txt"
          cp "$BUILD/_deps/nng-src/LICENSE.txt" "stage/$NAME/LICENSES/NNG.txt"
          tar -C stage -czf "$NAME.tar.gz" "$NAME"
          tar -tzf "$NAME.tar.gz"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $reported = & "$env:BUILD/nuq.exe" version
          if ($reported -ne "nuq $env:VERSION") { throw "nuq reports '$reported', not $env:VERSION" }
          cmake --install $env:BUILD --prefix "stage/$env:NAME"
          if ($LASTEXITCODE) { throw 'cmake --install failed' }
          New-Item -ItemType Directory "stage/$env:NAME/LICENSES" | Out-Null
          Copy-Item third_party/cjson/LICENSE "stage/$env:NAME/LICENSES/cJSON.txt"
          Copy-Item "$env:BUILD/_deps/nng-src/LICENSE.txt" "stage/$env:NAME/LICENSES/NNG.txt"
          Compress-Archive -Path "stage/$env:NAME" -DestinationPath "$env:NAME.zip"
          Get-ChildItem -Recurse -File "stage/$env:NAME" | ForEach-Object FullName

      - name: Smoke test the Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'nuq release smoke test'
          Expand-Archive -Path "$env:NAME.zip" -DestinationPath $destination
          $nuq = Join-Path $destination "$env:NAME/bin/nuq.exe"
          $reported = & $nuq version
          if ($LASTEXITCODE -ne 0 -or $reported -ne "nuq $env:VERSION") {
              throw "Packaged nuq reports '$reported', expected 'nuq $env:VERSION'"
          }
          $skill = (& $nuq skills show) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $skill -notmatch '(?m)^name: nuq$') {
              throw 'The packaged nuq skill could not be loaded'
          }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.zip
          if-no-files-found: error

  publish:
    needs: [version, package]
    if: >-
      !cancelled() && needs.package.result == 'success' &&
      needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the tag and the release
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum nuq-* >SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "nuq ${TAG#v}"
          --generate-notes

  # The Homebrew formula for these packages, installed with brew on macOS
  # and Linux. A dry run takes the packages from this run; a release
  # downloads them from the release it has just published, the way a user's
  # brew will.
  formula:
    needs: [version, package, publish]
    if: >-
      !cancelled() && needs.package.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISH: ${{ needs.version.outputs.publish }}
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The Linux runners come with Homebrew, but not on PATH.
      - name: Find brew (Linux)
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      - name: Write the formula
        run: |
          set -euo pipefail
          (cd dist && shasum -a 256 nuq-*) >SHA256SUMS
          if [ "$PUBLISH" = true ]; then
              .github/scripts/homebrew-formula.sh "$VERSION" SHA256SUMS >nuq.rb
          else
              .github/scripts/homebrew-formula.sh "$VERSION" SHA256SUMS "file://$PWD/dist" >nuq.rb
          fi
          cat nuq.rb
      # brew installs formulae only from a tap, and a tap that is not
      # Homebrew's own only once it is trusted.
      - name: Install it with brew
        run: |
          set -euo pipefail
          brew update
          tap="$(brew --repository)/Library/Taps/nuq/homebrew-scratch"
          mkdir -p "$tap/Formula"
          cp nuq.rb "$tap/Formula/nuq.rb"
          brew trust nuq/scratch
          brew install nuq/scratch/nuq
          brew test nuq/scratch/nuq
          reported=$("$(brew --prefix)/bin/nuq" version)
          [ "$reported" = "nuq $VERSION" ] || { echo "::error::brew installed '$reported', not nuq $VERSION"; exit 1; }

  # Point the tap at the release.
  tap:
    needs: [version, formula]
    if: >-
      !cancelled() && needs.formula.result == 'success' &&
      needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check the deploy key
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::The secret HOMEBREW_TAP_DEPLOY_KEY is not set, so $TAP still has the previous release"; exit 1; }
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.TAP }}
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - name: Write the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS
          .github/scripts/homebrew-formula.sh "$VERSION" SHA256SUMS >tap/Formula/nuq.rb
      - name: Push it
        working-directory: tap
        run: |
          set -euo pipefail
          git add Formula/nuq.rb
          if git diff --cached --quiet; then
              echo "$TAP already has nuq $VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "nuq $VERSION"
          git push origin HEAD:main
          echo "$TAP now has nuq $VERSION" | tee -a "$GITHUB_STEP_SUMMARY"
